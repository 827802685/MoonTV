# MoonTV Cloudflare Pages 配置
# 使用 Wrangler CLI 部署

name = "moon"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 构建配置
[build]
command = "pnpm pages:build"
output_directory = ".vercel/output/static"

# 环境变量
[vars]
USERNAME = "admin"
PASSWORD = "your_password"
NEXT_PUBLIC_STORAGE_TYPE = "d1"
SITE_NAME = "MoonTV"
ANNOUNCEMENT = "本网站仅提供影视信息搜索服务，所有内容均来自第三方网站。本站不存储任何视频资源，不对任何内容的准确性、合法性、完整性负责。"
NEXT_PUBLIC_ENABLE_REGISTER = "false"
NEXT_PUBLIC_DISABLE_YELLOW_FILTER = "false"
NEXT_PUBLIC_SEARCH_MAX_PAGE = "5"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moon-tv-db"
database_id = ""  # TODO: 在 Cloudflare 控制台创建 D1 数据库后填入 ID